<meta name="apple-mobile-web-app-title" content="Catch up">
<meta name="theme-color" content="#1C1C1E">
<script>
/* Resolve look and theme before first paint so nothing flashes. ?look=dusk&theme=dark also works for sharing a link. */
(function () {
  var d = document.documentElement, q = new URLSearchParams(location.search), look, th;
  try { look = q.get('look') || localStorage.getItem('fcu-look'); th = q.get('theme') || localStorage.getItem('fcu-theme'); } catch (e) { look = q.get('look'); th = q.get('theme'); }
  look = 'night';
  if (th !== 'light' && th !== 'dark') th = 'dark';  // dark by default; the Appearance menu can still switch it
  d.setAttribute('data-look', look); d.setAttribute('data-theme', th);
  try { var ac = localStorage.getItem('fcu-accent'); if (!(ac && /^#[0-9a-f]{6}$/i.test(ac))) ac = '#0E8C99'; { var n = parseInt(ac.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, m = function (c) { return Math.round(c + (255 - c) * .3); };
    d.style.setProperty('--accent-pick', ac); d.style.setProperty('--glow', ac); d.style.setProperty('--glow-rgb', r + ', ' + g + ', ' + b);
    d.style.setProperty('--hl', 'rgb(' + m(r) + ', ' + m(g) + ', ' + m(b) + ')'); } } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/fireflies/styles.css">
<link rel="stylesheet" href="/fireflies/looks.css">
<link rel="stylesheet" href="/fireflies/focus.css">
<script>
  // Vercel Web Analytics (same as the rest of the site); skipped locally.
  if (!/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname)) {
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    var va = document.createElement('script'); va.defer = true; va.src = '/_vercel/insights/script.js'; document.head.appendChild(va);

    // Ping Shater's phone once per visit (not for his own devices: open with ?me once to mark one).
    try {
      if (/[?&]me\b/.test(location.search)) localStorage.setItem('ff-me', '1');
      var key = 'ff-ping:' + location.pathname;
      if (!localStorage.getItem('ff-me') && !sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, '1');
        navigator.sendBeacon('/api/ping', JSON.stringify({ path: location.pathname, ref: document.referrer }));
      }
    } catch (_) {}
  }
</script>
</head>
