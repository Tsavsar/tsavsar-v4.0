<meta name="theme-color" content="#1C1C1E">
<script>
/* Resolve look and theme before first paint so nothing flashes. ?look=dusk&theme=dark also works for sharing a link. */
(function () {
  var d = document.documentElement, q = new URLSearchParams(location.search), look, th;
  try { look = q.get('look') || localStorage.getItem('fcu-look'); th = q.get('theme') || localStorage.getItem('fcu-theme'); } catch (e) { look = q.get('look'); th = q.get('theme'); }
  look = 'night';
  if (th !== 'light' && th !== 'dark') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  d.setAttribute('data-look', look); d.setAttribute('data-theme', th);
  try { var ac = localStorage.getItem('fcu-accent'); if (!(ac && /^#[0-9a-f]{6}$/i.test(ac))) ac = '#0E8C99'; { var n = parseInt(ac.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, m = function (c) { return Math.round(c + (255 - c) * .3); };
    d.style.setProperty('--accent-pick', ac); d.style.setProperty('--glow', ac); d.style.setProperty('--glow-rgb', r + ', ' + g + ', ' + b);
    d.style.setProperty('--hl', 'rgb(' + m(r) + ', ' + m(g) + ', ' + m(b) + ')'); } } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/fireflies/styles.css">
<link rel="stylesheet" href="/fireflies/looks.css">
</head>
